<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GRIP">
<meta name="theme-color" content="#16171A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<title>GRIP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#16171A;
  --surface:#1F2124;
  --surface-2:#26282C;
  --border:#2E3034;
  --border-strong:#3A3C40;
  --text:#F0F1EC;
  --text-2:#9A9C97;
  --text-3:#66685F;
  --accent:#D7F24C;
  --accent-dim:#8B9A3A;
  --accent-bg:#262B17;
  --iron:#E2603B;
  --iron-dim:#5C3527;
  --on-accent:#1A1D0A;
  --radius:10px;
  --safe-top:env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-size:16px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Inter',-apple-system,sans-serif;
  padding-bottom:calc(160px + env(safe-area-inset-bottom));
  min-height:100vh;
}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}

header{padding:calc(18px + var(--safe-top)) 16px 4px;background:var(--bg)}
.brand{
  font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1px;
  color:var(--accent);line-height:1;margin:0 0 2px;
}
.brand-sub{font-size:12px;color:var(--text-3);margin:0 0 12px}
.date-badge{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--accent)}

.date-row{display:flex;align-items:center;gap:10px}
.date-row input[type=date]{
  flex:1;background:var(--surface);border:0.5px solid var(--border);color:var(--text);
  border-radius:var(--radius);padding:9px 10px;font-family:'IBM Plex Mono',monospace;font-size:16px;
}
.reset-btn{
  background:none;border:0.5px solid var(--iron-dim);color:var(--iron);
  border-radius:var(--radius);padding:9px 12px;font-size:13px;white-space:nowrap;cursor:pointer;
  font-family:'Inter',sans-serif;
}
.reset-btn:active{transform:scale(0.96)}

/* 스크롤해도 요일 탭과 진행률은 항상 보이도록 상단에 고정 */
.sticky-bar{
  position:sticky;top:var(--safe-top);z-index:10;background:var(--bg);
  padding:10px 16px;border-bottom:0.5px solid var(--border);
  box-shadow:0 calc(-1 * var(--safe-top)) 0 var(--bg);
}
.day-tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day-tab{
  background:var(--surface);border:0.5px solid var(--border);color:var(--text-2);
  border-radius:var(--radius);padding:7px 0 6px;cursor:pointer;font-family:'Inter',sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25;
}
.day-tab .dt-d{font-size:14px;font-weight:600}
.day-tab .dt-n{font-size:10px;color:var(--text-3)}
.day-tab.today{border-color:var(--accent-dim)}
.day-tab.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day-tab.active .dt-n{color:var(--on-accent)}

.progress{display:flex;align-items:center;gap:10px;margin-top:10px}
.progress-track{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .25s}
.progress-text{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-2);white-space:nowrap}
.progress.is-rest .progress-track{visibility:hidden}

main{padding:16px}

.section-label{
  font-size:12px;color:var(--text-3);letter-spacing:0.6px;
  margin:22px 0 8px;padding:0 2px;
}
.section-label:first-child{margin-top:4px}

.ex-card{
  background:var(--surface);border:0.5px solid var(--border);border-radius:12px;
  padding:14px;margin-bottom:10px;
}
.ex-card.complete{border-color:var(--accent-dim)}
.ex-head{display:flex;align-items:flex-start;gap:10px}
.ex-num{
  flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--text-2);
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.ex-card.complete .ex-num{background:var(--accent);color:var(--on-accent)}
.ex-title{
  flex:1;min-width:0;background:none;border:none;padding:0;margin:0;text-align:left;
  color:var(--text);cursor:pointer;font-family:inherit;
}
.ex-name{font-size:15px;font-weight:600;margin:0;display:flex;align-items:center;gap:6px}
.chev{font-size:11px;color:var(--text-3);transition:transform .2s}
.ex-card.open .chev{transform:rotate(180deg)}
.ex-target{display:block;font-size:12px;color:var(--text-2);margin:3px 0 0}
.ex-note{font-size:12px;color:var(--text-2);margin:8px 0 0}
.ex-last{font-size:12px;color:var(--accent-dim);margin:6px 0 0;font-family:'IBM Plex Mono',monospace}
.badge-done{
  display:none;flex:none;font-size:11px;font-weight:600;color:var(--on-accent);
  background:var(--accent);border-radius:6px;padding:3px 7px;
}
.ex-card.complete .badge-done{display:inline-block}
.guide{
  display:none;margin-top:10px;padding:10px 12px;background:var(--surface-2);
  border-radius:var(--radius);font-size:13px;line-height:1.6;color:var(--text-2);
}
.guide b{display:block;font-size:11px;color:var(--text-3);font-weight:500;margin-bottom:2px}
.ex-card.open .guide{display:block}

.set-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.set-chip{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  background:var(--surface-2);border:0.5px solid var(--border);border-radius:var(--radius);
  padding:8px 6px 6px;width:100px;
}
.set-chip.filled{border-color:var(--border-strong)}
.set-chip.done{border-color:var(--accent);background:var(--accent-bg)}
.set-chip-label{font-size:10px;color:var(--text-3);letter-spacing:0.4px}
.set-chip input{
  background:transparent;border:none;color:var(--text);text-align:right;
  font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;padding:2px 0;width:40px;
}
.set-chip input::placeholder{color:var(--text-3);font-weight:500}
.set-chip .divider{height:0.5px;background:var(--border);width:100%}
.field-row{display:flex;align-items:baseline;justify-content:center;gap:3px;width:100%}
.unit{font-size:10px;color:var(--text-3)}
.side{font-size:10px;color:var(--text-3);min-width:10px}
.check-btn{
  width:100%;height:36px;margin-top:2px;border-radius:8px;cursor:pointer;
  border:0.5px solid var(--border-strong);background:transparent;color:var(--text-3);
  font-size:16px;font-weight:600;font-family:'Inter',sans-serif;
}
.check-btn:active{transform:scale(0.97)}
.set-chip.done .check-btn,.run-check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.set-controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.ctrl-btn{
  background:var(--surface-2);border:0.5px solid var(--border);color:var(--text-2);
  border-radius:var(--radius);padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;
  font-family:'Inter',sans-serif;
}
.ctrl-btn:active{transform:scale(0.96)}
.set-count{font-size:12px;color:var(--text-3);font-family:'IBM Plex Mono',monospace;min-width:44px;text-align:center}

.quick-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag-btn{
  background:var(--surface-2);border:0.5px solid var(--border);color:var(--text-2);
  border-radius:var(--radius);padding:5px 10px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;
}
.tag-btn:active{transform:scale(0.97)}

.run-inputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.run-field{
  background:var(--surface-2);border:0.5px solid var(--border);border-radius:var(--radius);
  padding:8px 10px;display:flex;flex-direction:column;gap:2px;
}
.run-field > span:first-child{font-size:10px;color:var(--text-3)}
.run-field input{
  background:transparent;border:none;color:var(--text);padding:2px 0;width:100%;min-width:0;
  font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;
}
.run-field input::placeholder{color:var(--text-3);font-weight:500}
.run-field .field-row{justify-content:flex-start}
.run-stats{font-size:12px;color:var(--text-2);margin:10px 0 0;font-family:'IBM Plex Mono',monospace;min-height:16px}
.run-check{height:44px;margin-top:12px;font-size:14px}

.save-bar{
  position:fixed;bottom:0;left:0;right:0;background:var(--bg);z-index:20;
  border-top:0.5px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;
}
.save-row{display:flex;align-items:center;gap:10px}
.save-primary{
  flex:1;background:var(--accent);border:none;color:var(--on-accent);
  border-radius:var(--radius);padding:12px;font-size:14px;font-weight:600;cursor:pointer;
  font-family:'Inter',sans-serif;
}
.save-primary:active{transform:scale(0.98)}
.save-status{font-size:12px;color:var(--text-2);font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.backup-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.backup-btn{
  background:none;border:0.5px solid var(--border-strong);color:var(--text-2);
  border-radius:var(--radius);padding:8px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;
}

.history-toggle{
  width:100%;background:none;border:0.5px solid var(--border-strong);color:var(--text-2);
  border-radius:var(--radius);padding:10px;font-size:13px;margin-top:24px;cursor:pointer;
  font-family:'Inter',sans-serif;
}
.history-list{margin-top:12px}
.history-item{
  width:100%;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between;gap:10px;
  cursor:pointer;color:var(--text);font-family:inherit;text-align:left;
}
.history-item .d{color:var(--text-2)}
.history-item .n{font-family:'IBM Plex Mono',monospace;color:var(--text);white-space:nowrap}
.history-item.legacy .d{color:var(--text-3)}
.history-detail{
  margin:-2px 0 8px;padding:10px 12px;background:var(--surface-2);border-radius:var(--radius);
  font-size:12px;line-height:1.7;color:var(--text-2);
}
.history-detail .hd-row{display:flex;justify-content:space-between;gap:10px}
.history-detail .hd-row span:last-child{font-family:'IBM Plex Mono',monospace;color:var(--text);text-align:right}

.empty-note{font-size:12px;color:var(--text-3);text-align:center;padding:20px 0}

@media (prefers-reduced-motion:reduce){
  .progress-fill,.chev{transition:none}
}
</style>
</head>
<body>

<header>
  <div style="display:flex;justify-content:space-between;align-items:baseline">
    <p class="brand">GRIP</p>
    <span class="date-badge" id="dateBadge"></span>
  </div>
  <p class="brand-sub" id="programLabel">12주 프로그램</p>
  <div class="date-row">
    <input type="date" id="dateInput" aria-label="날짜 선택">
    <button type="button" class="reset-btn" id="resetBtn">초기화</button>
  </div>
</header>

<div class="sticky-bar">
  <div class="day-tabs" id="dayTabs"></div>
  <div class="progress" id="progress">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-text" id="progressText"></span>
  </div>
</div>

<main class="wrap" id="main"></main>

<div class="wrap">
  <button class="history-toggle" id="historyToggle">지난 기록 보기</button>
  <div class="history-list" id="historyList" style="display:none"></div>
</div>

<div class="save-bar">
  <div class="save-row">
    <button class="save-primary" id="saveBtn">저장하기</button>
    <span class="save-status" id="saveStatus">불러오는 중...</span>
  </div>
  <div class="backup-btns">
    <button class="backup-btn" id="exportBtn">내보내기</button>
    <button class="backup-btn" id="importBtn">가져오기</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>
</div>

<script>
/*
  이 앱은 폰 브라우저의 localStorage에 데이터를 저장합니다.
  기기를 바꾸거나 브라우저 데이터를 지우면 기록이 사라질 수 있으니,
  가끔 하단의 "내보내기"로 백업 파일을 저장해두는 걸 추천해요.

  저장 키
  - p12_요일_날짜 : 12주 프로그램(2026.11.23~) 기록
  - log_요일_날짜 : 이전 4분할 루틴 기록 (지우지 않고 읽기 전용으로 보존)
*/
const storage = {
  async get(key){
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v };
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return { key, value };
  },
  async list(prefix){
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(prefix)) keys.push(k);
    }
    return { keys };
  },
  async delete(key){
    localStorage.removeItem(key);
    return { key, deleted:true };
  }
};

/* ───────── 12주 프로그램 ───────── */
const PREFIX = 'p12_';
const PROGRAM_START = '2026-11-23';
const PROGRAM_END = '2027-02-14';

/* 운동 사전: 같은 운동은 요일이 달라도 같은 키를 써서 '지난번' 기록이 이어짐 */
const EX = {
  chest_press:{ name:'머신 체스트 프레스', rest:'120~180초',
    guide:'손잡이가 가슴 중간 높이에 오도록 시트를 맞추고, 어깨를 뒤로 모은 채 등을 등받이에 붙입니다. 팔꿈치를 끝까지 잠그지 말고, 밀 때 어깨가 앞으로 말리지 않게 주의하세요.' },
  iso_row:{ name:'Iso Row', rest:'120~180초',
    guide:'가슴을 패드에 붙이고 손이 아니라 팔꿈치를 뒤로 보낸다는 느낌으로 당깁니다. 상체를 젖히며 반동을 쓰지 말고, 끝에서 견갑골을 모았다가 천천히 펴세요.' },
  lat_pull:{ name:'랫풀다운', rest:'약 120초',
    guide:'가슴을 살짝 내밀고 팔꿈치를 옆구리로 끌어내린다는 느낌으로 바를 쇄골 쪽으로 당깁니다. 몸을 크게 뒤로 젖히거나 목 뒤로 당기지 마세요.' },
  shoulder_press:{ name:'머신 숄더 프레스', rest:'약 120초',
    guide:'손잡이가 어깨 높이에서 시작하도록 시트를 맞추고 허리를 등받이에 붙입니다. 허리가 과하게 꺾이거나 어깨가 귀 쪽으로 으쓱 올라가지 않게 하세요.' },
  lateral:{ name:'사이드 레터럴 레이즈', rest:'60~90초',
    guide:'팔꿈치를 살짝 굽힌 채 손이 아니라 팔꿈치로 들어 올린다는 느낌으로 어깨 높이까지만 올립니다. 몸을 흔들거나 승모근으로 들게 되면 무게를 낮추세요.' },
  preacher:{ name:'프리처 컬', rest:'60~90초',
    guide:'팔 뒷면을 패드에 밀착하고 팔꿈치를 고정한 채 올립니다. 내릴 때 툭 떨어뜨리면 팔꿈치에 무리가 가니 천천히 내리고 끝까지 잠그지 마세요.' },
  pushdown:{ name:'케이블 푸시다운', rest:'60~90초',
    guide:'팔꿈치를 옆구리에 고정하고 팔뚝만 움직여 끝까지 펴줍니다. 상체를 숙여 체중으로 누르거나 팔꿈치가 앞뒤로 흔들리지 않게 하세요.' },
  leg_press:{ name:'레그 프레스', rest:'120~180초',
    guide:'발을 어깨너비로 플랫폼 중앙에 두고 무릎이 발끝 방향을 따라가게 내립니다. 엉덩이가 시트에서 들릴 만큼 깊게 내리지 말고, 펼 때 무릎을 끝까지 잠그지 마세요.' },
  db_rdl:{ name:'덤벨 루마니안 데드리프트', rest:'약 120초',
    guide:'무릎은 살짝만 굽힌 채 엉덩이를 뒤로 빼며 덤벨을 허벅지 앞을 따라 내립니다. 허리가 둥글게 말리기 전, 보통 정강이 중간쯤에서 멈추고 엉덩이 힘으로 일어나세요.' },
  leg_curl:{ name:'레그 컬', rest:'약 90~120초',
    guide:'무릎을 기계 회전축과 일직선으로 맞추고 패드는 발목 바로 위에 둡니다. 엉덩이가 들리지 않게 고정하고, 내릴 때 무게가 툭 떨어지지 않게 조절하세요.' },
  calf:{ name:'카프 레이즈', rest:'60~90초',
    guide:'발뒤꿈치를 최대한 깊게 내렸다가 발끝으로 끝까지 올라가 1초 멈춥니다. 무릎 반동으로 튕기지 말고 전체 가동범위를 쓰세요.' },
  cable_crunch:{ name:'케이블 크런치', rest:'60~90초',
    guide:'무릎을 꿇고 로프를 머리 옆에 고정한 채 갈비뼈를 골반 쪽으로 말아 내린다는 느낌으로 수행합니다. 엉덩이를 뒤로 앉으며 체중으로 당기지 않게 하세요.' },
  smith_incline:{ name:'스미스 인클라인 벤치프레스', rest:'약 90~120초', tags:['빈바'],
    guide:'벤치를 30도 안팎으로 세우고 바가 윗가슴(쇄골 아래)으로 내려오도록 벤치 위치를 맞춥니다. 팔꿈치를 몸통과 45~60도로 유지하고, 견갑을 모아 어깨가 들리지 않게 하세요.' },
  onearm_row:{ name:'원암 케이블 로우', rest:'약 90~120초', uni:true, uniLabel:'좌우 각각',
    note:'좌우 모두 정해진 횟수를 해야 1세트예요.',
    guide:'상체를 세운 채 팔꿈치를 엉덩이 쪽으로 끌어당기고, 몸통이 크게 돌아가지 않게 버팁니다. 당긴 끝에서 잠깐 멈추고 천천히 팔을 펴세요.' },
  reverse_pec:{ name:'리버스 펙덱', rest:'약 90~120초',

/* 요일별 루틴: [운동 키, 세트, 반복] — 제공된 표 순서 그대로 */

const DAY_ORDER = ['mon','tue','wed','thu','fri','sat','sun'];

const DAY_CHAR = { mon:'월', tue:'화', wed:'수', thu:'목', fri:'금', sat:'토', sun:'일' };
const RUN_GOAL_SEC = 12*60 + 30;

/* ───────── 이전 4분할 루틴 (읽기 전용) ───────── */
const LEGACY = {
  mon:{ label:'등·이두', uni:['m3','m6'], ex:{ m1:'랫풀다운', m2:'체스트 서포티드 로우', m3:'원암 케이블로우', m4:'스트레이트암 풀다운', m5:'프리처컬 · 케이블컬', m6:'덤벨 해머컬', m7:'케이블 크런치', m8:'플랭크(초)' }},
  tue:{ label:'가슴·삼두', uni:[], ex:{ t1:'스미스 벤치프레스', t2:'인클라인 체스트프레스', t3:'펙덱 플라이', t4:'케이블 푸시다운', t5:'오버헤드 케이블 익스텐션' }},
  thu:{ label:'하체', uni:['h2','h8'], ex:{ h1:'레그프레스', h2:'불가리안 스플릿 스쿼트', h3:'레그컬', h4:'스미스 루마니안 데드리프트', h5:'레그익스텐션', h6:'카프레이즈', h7:'니레이즈 · 리버스 크런치', h8:'사이드 플랭크(초)' }},
  sat:{ label:'어깨', uni:['s2'], ex:{ s1:'머신 숄더프레스', s2:'한 손 케이블 레터럴레이즈', s3:'리버스 펙덱', s4:'랫풀다운 (보완)', s5:'인클라인 체스트프레스 (보완)', s6:'페이스풀' }},
};
/* 같은 운동이면 예전 기록도 새 루틴의 '지난번'으로 이어서 보여줌 */
const LEGACY_LINK = { m1:'lat_pull', m3:'onearm_row', m5:'preacher', m6:'hammer', m7:'cable_crunch', t4:'pushdown', t5:'oh_ext',
  h1:'leg_press', h2:'bulgarian', h3:'leg_curl', h5:'leg_ext', h6:'calf', s1:'shoulder_press', s3:'reverse_pec' };

let state = { day:'mon', date: todayStr() };
let rec = null;      // 지금 화면에 있는 기록 (저장 전까지 메모리에만 있음)
let dirty = false;   // 저장하지 않은 변경이 있는지
let ALL = [];        // 저장된 전체 기록 (최근 날짜 순)

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function formatDateLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const week = ['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}.${d.getDate()}.${week[d.getDay()]}`;
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shortDate(d){ const p = d.split('-'); return (+p[1])+'.'+(+p[2]); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function weekdayToDay(dateStr){ return WD_TO_DAY[new Date(dateStr+'T00:00:00').getDay()]; }
function keyFor(day, date){ return PREFIX+day+'_'+date; }
function blankSet(){ return { w:'', r:'', r2:'', d:false }; }
function hasVal(s){ return !!(s && (s.w || s.r || s.r2)); }

function programLabel(date){
  const n = daysBetween(PROGRAM_START, date);
  if(n < 0) return `12주 프로그램 · ${shortDate(PROGRAM_START)} 시작 (D-${-n})`;
  if(date > PROGRAM_END) return `12주 프로그램 완료 · ${shortDate(PROGRAM_END)} 종료`;
  return `12주 프로그램 · ${Math.floor(n/7)+1}주차`;
}

function fmtWeight(w){
  if(!w) return '-';
  return /^[0-9.]+$/.test(w) ? w+'kg' : w;
}
function repText(s, uni){ return uni ? `${s.r||'-'}/${s.r2||'-'}` : (s.r||'-'); }
function fmtSets(sets, uni){
  const ws = sets.map(s=>s.w||'');
  if(ws.every(w=>w===ws[0])){
    const reps = sets.map(s=>repText(s,uni)).join('·') + '회';
    return ws[0] ? `${fmtWeight(ws[0])} × ${reps}` : reps;
  }
  return sets.map(s=>`${fmtWeight(s.w)}×${repText(s,uni)}`).join(' · ');
}
function fmtTime(totalSec){
  const m = Math.floor(totalSec/60), s = Math.round(totalSec%60);
  return `${m}:${String(s).padStart(2,'0')}`;
}

/* ───────── 저장된 기록 읽기 ───────── */
function readAll(){
  const out = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    const m = k && k.match(/^(p12|log)_([a-z]{3})_(\d{4}-\d{2}-\d{2})$/);
    if(!m) continue;
    let data = null;
    try{ data = JSON.parse(localStorage.getItem(k)); }catch(e){ continue; }
    if(data) out.push({ key:k, legacy: m[1]==='log', day:m[2], date:m[3], data });
  }
  return out.sort((a,b)=> b.date.localeCompare(a.date));
}

function legacySets(day, id, data){
  const arr = data.exercises && data.exercises[id];
  if(!Array.isArray(arr)) return [];
  const L = LEGACY[day];
  if(!(L && L.uni.includes(id))) return arr.map(s=>({ w:s.weight||'', r:s.reps||'', r2:'' }));
  const out = [];
  for(let i=0;i<arr.length;i+=2){
    const a = arr[i]||{}, b = arr[i+1]||{};
    out.push({ w:a.weight||b.weight||'', r:a.reps||'', r2:b.reps||'' });
  }
  return out;
}

/* 이 운동을 마지막으로 했던 날의 세트들 (오늘 이전, 새/예전 루틴 모두에서 찾음) */
function lastFor(exKey, before){
  for(const it of ALL){
    if(it.date >= before) continue;
    let sets = [];
    if(!it.legacy){
      sets = (it.data.ex && it.data.ex[exKey]) || [];
    } else {
      const L = LEGACY[it.day];
      if(!L) continue;
      for(const id in LEGACY_LINK){
        if(LEGACY_LINK[id]===exKey && L.ex[id]){ sets = legacySets(it.day, id, it.data); break; }
      }
    }
    const filled = sets.filter(hasVal);
    if(filled.length) return { date:it.date, sets:filled };
  }
  return null;
}

function lastRun(before){
  for(const it of ALL){
    if(it.legacy || it.date >= before) continue;
    const r = it.data.run;
    if(r && (r.min || r.sec)) return { date:it.date, run:r };
  }
  return null;
}

function loadRecord(){
  let r = null;
  try{ r = JSON.parse(localStorage.getItem(keyFor(state.day, state.date))); }catch(e){}
  if(!r || r.v !== 2) r = { v:2, date:state.date, day:state.day, ex:{}, run:null };
  const day = DAYS[state.day];
  if(day.type==='weight'){
    r.ex = r.ex || {};
    day.list.forEach(([k,sets])=>{
      if(!Array.isArray(r.ex[k]) || !r.ex[k].length) r.ex[k] = Array.from({length:sets}, blankSet);
    });
  } else if(day.type==='run'){
    r.run = Object.assign({ km:'', min:'', sec:'', d:false }, r.run||{});
  }
  return r;
}

/* ───────── 화면 그리기 ───────── */
function setStatus(t){ document.getElementById('saveStatus').textContent = t; }
function markDirty(){ dirty = true; setStatus('변경됨 · 저장 필요'); }

function renderTabs(){
  const el = document.getElementById('dayTabs');
  el.innerHTML = '';
  const scheduled = weekdayToDay(state.date);
  DAY_ORDER.forEach(d=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'day-tab' + (state.day===d ? ' active' : '') + (scheduled===d ? ' today' : '');
    btn.setAttribute('aria-label', `${DAY_CHAR[d]}요일 ${DAYS[d].name}`);
    btn.innerHTML = `<span class="dt-d">${DAY_CHAR[d]}</span><span class="dt-n">${DAYS[d].short}</span>`;
    btn.onclick = async ()=>{
      if(d===state.day) return;
      if(!(await guardLeave())) return;
      state.day = d;
      loadAndRender();
    };
    el.appendChild(btn);
  });
}

function updateProgress(){
  const day = DAYS[state.day];
  const wrap = document.getElementById('progress');
  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');
  wrap.classList.toggle('is-rest', day.type==='rest');
  if(day.type==='rest'){ fill.style.width = '0%'; text.textContent = '휴식일'; return; }
  let done = 0, total = 0;
  if(day.type==='weight'){
    day.list.forEach(([k])=>{ const s = rec.ex[k]; total += s.length; done += s.filter(x=>x.d).length; });
  } else {
    total = 1; done = rec.run.d ? 1 : 0;
  }
  const pct = total ? Math.round(done/total*100) : 0;
  fill.style.width = pct + '%';
  text.textContent = day.type==='weight' ? `${done}/${total} 세트 · ${pct}%` : (done ? '러닝 완료 · 100%' : '러닝 전 · 0%');
}

function ph(last, i, f){
  if(!last) return '';
  const s = last.sets[i] || last.sets[last.sets.length-1];
  return (s && s[f]) || '';
}

function paintChip(chip, s){
  chip.classList.toggle('done', !!s.d);
  chip.classList.toggle('filled', !s.d && hasVal(s));
  chip.querySelector('.check-btn').setAttribute('aria-pressed', s.d ? 'true' : 'false');
}
function updateCard(card, sets){
  card.classList.toggle('complete', sets.length>0 && sets.every(s=>s.d));
}

function makeChip(ex, sets, i, last, card){
  const s = sets[i];
  const chip = document.createElement('div');
  chip.className = 'set-chip';
  const field = (f, unit, side)=>`
    <div class="field-row">
      ${side ? `<span class="side">${side}</span>` : ''}
      <input type="${f==='w'?'text':'number'}" inputmode="${f==='w'?'decimal':'numeric'}" data-f="${f}"
        placeholder="${esc(ph(last,i,f) || '0')}" aria-label="${i+1}세트 ${side ? side+' ' : ''}${unit==='kg'?'무게':'횟수'}">
      <span class="unit">${unit}</span>
    </div>`;
  chip.innerHTML = `
    <span class="set-chip-label">SET ${i+1}</span>
    ${field('w','kg')}
    <div class="divider"></div>
    ${ex.uni ? field('r','회','좌') + field('r2','회','우') : field('r','회')}
    <button type="button" class="check-btn" aria-label="${i+1}세트 완료">✓</button>`;

  chip.querySelectorAll('input').forEach(inp=>{
    inp.value = s[inp.dataset.f] || '';
    inp.addEventListener('input', ()=>{
      s[inp.dataset.f] = inp.value.trim();
      paintChip(chip, s);
      markDirty();
    });
  });
  // ✓ 를 누를 때 비어 있는 칸은 바로 앞 세트 값 → 지난번 값 순서로 채움
  chip.querySelector('.check-btn').addEventListener('click', ()=>{
    s.d = !s.d;
    if(s.d){
      ['w','r'].concat(ex.uni ? ['r2'] : []).forEach(f=>{
        if(!s[f]) s[f] = (sets[i-1] && sets[i-1][f]) || ph(last, i, f) || '';
      });
      chip.querySelectorAll('input').forEach(inp=>{ inp.value = s[inp.dataset.f] || ''; });
    }
    paintChip(chip, s);
    updateCard(card, sets);
    updateProgress();
    markDirty();
  });
  paintChip(chip, s);
  return chip;
}

function renderExercise(k, planned, reps, idx){
  const ex = EX[k];
  const sets = rec.ex[k];
  const last = lastFor(k, state.date);
  const card = document.createElement('div');
  card.className = 'ex-card';
  const repLine = `${planned}세트 × ${reps}회${ex.uni ? ` (${ex.uniLabel})` : ''} · 휴식 ${ex.rest}`;
  const tags = (ex.tags||[]).map(t=>`<button type="button" class="tag-btn" data-tag="${t}">전체 ${t}</button>`).join('');

  card.innerHTML = `
    <div class="ex-head">
      <span class="ex-num">${idx+1}</span>
      <button type="button" class="ex-title" aria-expanded="false">
        <span class="ex-name">${esc(ex.name)} <span class="chev" aria-hidden="true">▾</span></span>
        <span class="ex-target">${repLine}</span>
      </button>
      <span class="badge-done">완료</span>
    </div>
    ${ex.note ? `<p class="ex-note">${ex.note}</p>` : ''}
    ${last ? `<p class="ex-last">지난번 ${shortDate(last.date)} · ${esc(fmtSets(last.sets, ex.uni))}</p>` : ''}
    <div class="guide"><b>자세 포인트</b>${ex.guide}</div>
    <div class="set-grid"></div>
    <div class="set-controls">
      <button type="button" class="ctrl-btn" data-action="remove" aria-label="세트 삭제">− 세트</button>
      <span class="set-count"></span>
      <button type="button" class="ctrl-btn" data-action="add" aria-label="세트 추가">+ 세트</button>
    </div>
    <div class="quick-tags">
      ${tags}
      <button type="button" class="tag-btn" data-action="copy-first">1세트 값 복사</button>
    </div>`;

  const grid = card.querySelector('.set-grid');
  const countEl = card.querySelector('.set-count');
  const refresh = ()=>{
    grid.innerHTML = '';
    sets.forEach((_, i)=> grid.appendChild(makeChip(ex, sets, i, last, card)));
    countEl.textContent = sets.length + '세트';
    updateCard(card, sets);
  };
  refresh();

  const title = card.querySelector('.ex-title');
  title.addEventListener('click', ()=>{
    const open = card.classList.toggle('open');
    title.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  card.querySelector('[data-action="add"]').addEventListener('click', ()=>{
    sets.push(blankSet());
    refresh(); updateProgress(); markDirty();
  });
  card.querySelector('[data-action="remove"]').addEventListener('click', ()=>{
    if(sets.length <= 1) return;
    sets.pop();
    refresh(); updateProgress(); markDirty();
  });
  card.querySelectorAll('.tag-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.action === 'copy-first'){
        const f = sets[0];
        sets.slice(1).forEach(s=>{ s.w = f.w; s.r = f.r; s.r2 = f.r2; });
      } else {
        sets.forEach(s=>{ s.w = btn.dataset.tag; });
      }
      refresh(); markDirty();
    });
  });
  return card;
}

    <p class="run-stats"></p>

  const stats = card.querySelector('.run-stats');
  const paint = ()=>{
    const km = parseFloat(r.km), t = (+r.min||0)*60 + (+r.sec||0);

    if(km > 0 && t > 0){
      const pace = t/km;
      msg = `페이스 ${Math.floor(pace/60)}'${String(Math.round(pace%60)).padStart(2,'0')}"/km`;
      if(Math.abs(km-3) < 0.05){
        const diff = t - RUN_GOAL_SEC;
        msg += diff <= 0 ? ' · 목표 12:30 달성' : ` · 목표까지 ${fmtTime(diff)} 단축`;
      }
    }
    stats.textContent = msg;
    card.querySelector('.run-check').setAttribute('aria-pressed', r.d ? 'true' : 'false');
    card.classList.toggle('complete', !!r.d);
  };
  card.querySelectorAll('input').forEach(inp=>{
    inp.value = r[inp.dataset.f] || '';
    inp.addEventListener('input', ()=>{ r[inp.dataset.f] = inp.value.trim(); paint(); markDirty(); });
  });
  card.querySelector('.run-check').addEventListener('click', ()=>{
    r.d = !r.d;
    if(r.d && !r.km){ r.km = '3'; card.querySelector('[data-f="km"]').value = '3'; }
    paint(); updateProgress(); markDirty();
  });
  paint();
  return card;
}

function renderRest(){
  const card = document.createElement('div');
  card.className = 'ex-card';
  card.innerHTML = `
    <p class="ex-name">완전 휴식</p>
    <span class="ex-target">별도의 운동 프로그램 없음</span>
    <p class="ex-note">다음 운동: 일요일 06:00 러닝</p>`;
  return card;
}

function renderMain(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  const day = DAYS[state.day];
  const head = document.createElement('div');
  head.className = 'section-label';
  main.appendChild(head);
  if(day.type==='weight'){
    const total = day.list.reduce((a,[,s])=>a+s, 0);
    head.textContent = `${day.name} · ${day.time} · ${day.list.length}종목 ${total}세트 · 운동명을 누르면 자세 안내`;
    day.list.forEach(([k,sets,reps], idx)=> main.appendChild(renderExercise(k, sets, reps, idx)));
  } else if(day.type==='run'){
    head.textContent = `러닝 · ${day.time}`;
    main.appendChild(renderRun());
  } else {
    head.textContent = '토요일 · 휴식';
    main.appendChild(renderRest());
  }
  updateProgress();
}

function loadAndRender(){
  ALL = readAll();
  document.getElementById('dateBadge').textContent = formatDateLabel(state.date);
  document.getElementById('programLabel').textContent = programLabel(state.date);
  const saved = localStorage.getItem(keyFor(state.day, state.date)) !== null;
  rec = loadRecord();
  dirty = false;
  renderTabs();
  renderMain();
  if(DAYS[state.day].type==='rest') setStatus('오늘은 휴식일이에요');
  else setStatus(saved ? '저장된 기록을 불러왔어요' : '세트를 마치면 ✓ 를 누르세요');
}

/* ───────── 저장 ───────── */
async function saveNow(){
  if(DAYS[state.day].type==='rest'){ setStatus('휴식일은 기록할 항목이 없어요'); return false; }
  rec.date = state.date; rec.day = state.day; rec.savedAt = Date.now();
  try{
    await storage.set(keyFor(state.day, state.date), JSON.stringify(rec));
    dirty = false;
    ALL = readAll();
    setStatus('저장됨 · ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
    return true;
  }catch(e){
    setStatus('저장 실패 (다시 시도해주세요)');
    return false;
  }
}

/* 저장하지 않은 채 다른 날짜·요일로 넘어가 기록이 사라지는 것을 막음 */
async function guardLeave(){
  if(!dirty) return true;
  if(confirm('저장하지 않은 기록이 있어요.\n\n확인: 저장하고 이동\n취소: 이 화면에 머무르기')) return await saveNow();
  return false;
}
window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue = ''; } });

document.getElementById('dateInput').addEventListener('change', async (e)=>{
  const v = e.target.value;
  if(!v || !(await guardLeave())){ e.target.value = state.date; return; }
  state.date = v;
  state.day = weekdayToDay(v);
  loadAndRender();
});

document.getElementById('resetBtn').addEventListener('click', async ()=>{
  if(DAYS[state.day].type==='rest'){ setStatus('휴식일은 초기화할 기록이 없어요'); return; }
  const ok = confirm(`${state.date} (${DAYS[state.day].name}) 기록을 전체 초기화할까요?\n되돌릴 수 없습니다.`);
  if(!ok) return;
  try{ await storage.delete(keyFor(state.day, state.date)); }catch(e){}
  loadAndRender();
  setStatus('초기화됨');
});

// 하단 고정 바 높이만큼 페이지 아래 여백을 자동으로 맞춰서, 마지막 내용이 바 뒤에 가려지지 않게 함
(function fitBottomSpace(){
  const bar = document.querySelector('.save-bar');
  if(!bar) return;
  const apply = ()=>{ document.body.style.paddingBottom = (bar.offsetHeight + 24) + 'px'; };
  apply();
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', apply);
  if(window.ResizeObserver) new ResizeObserver(apply).observe(bar);
})();

/* ───────── 지난 기록 ───────── */
function recordSummary(it){
  const D = DAYS[it.day];
  if(!D) return '';
  if(D.type==='weight' && it.data.ex){
    let done = 0, total = 0;
    D.list.forEach(([k])=>{ const s = it.data.ex[k] || []; total += s.length; done += s.filter(x=>x.d).length; });
    return `${done}/${total} 세트`;
  }
  if(D.type==='run' && it.data.run){
    const r = it.data.run;
    return (r.min || r.sec) ? `${r.km||'-'}km ${fmtTime((+r.min||0)*60 + (+r.sec||0))}` : (r.d ? '완료' : '');
  }
  return '';
}

function legacyDetail(it){
  const L = LEGACY[it.day];
  const div = document.createElement('div');
  div.className = 'history-detail';
  let rows = '';
  if(L){
    Object.keys(L.ex).forEach(id=>{
      const sets = legacySets(it.day, id, it.data).filter(hasVal);
      if(sets.length) rows += `<div class="hd-row"><span>${esc(L.ex[id])}</span><span>${esc(fmtSets(sets, L.uni.includes(id)))}</span></div>`;
    });
  }
  if(it.data.cardio) rows += `<div class="hd-row"><span>러닝머신 걷기</span><span>${esc(it.data.cardio)}분</span></div>`;
  div.innerHTML = rows || '입력된 값이 없어요.';
  return div;
}

document.getElementById('historyToggle').addEventListener('click', ()=>{
  const listEl = document.getElementById('historyList');
  const toggle = document.getElementById('historyToggle');
  if(listEl.style.display !== 'none'){
    listEl.style.display = 'none';
    toggle.textContent = '지난 기록 보기';
    return;
  }
  listEl.style.display = 'block';
  toggle.textContent = '지난 기록 닫기';
  const sticky = document.querySelector('.sticky-bar');
  const stickyTop = parseFloat(getComputedStyle(sticky).top) || 0;
  const top = toggle.getBoundingClientRect().top + window.scrollY - sticky.offsetHeight - stickyTop - 12;
  window.scrollTo({ top, behavior:'smooth' });

  ALL = readAll();
  listEl.innerHTML = '';
  if(!ALL.length){ listEl.innerHTML = '<p class="empty-note">아직 기록이 없어요.</p>'; return; }
  ALL.slice(0, 40).forEach(it=>{
    const row = document.createElement('button');
    row.type = 'button';
    if(!it.legacy){
      const D = DAYS[it.day];
      if(!D) return;
      row.className = 'history-item';
      row.innerHTML = `<span class="d">${it.date} · ${D.name}</span><span class="n">${recordSummary(it) || '보기'}</span>`;
      row.onclick = async ()=>{
        if(!(await guardLeave())) return;
        state.date = it.date;
        state.day = it.day;
        document.getElementById('dateInput').value = it.date;
        listEl.style.display = 'none';
        toggle.textContent = '지난 기록 보기';
        loadAndRender();
        window.scrollTo({ top:0, behavior:'smooth' });
      };
      listEl.appendChild(row);
    } else {
      const L = LEGACY[it.day];
      row.className = 'history-item legacy';
      row.innerHTML = `<span class="d">${it.date} · 이전 루틴 ${L ? L.label : ''}</span><span class="n">펼치기</span>`;
      let detail = null;
      row.onclick = ()=>{
        if(detail){ detail.remove(); detail = null; row.querySelector('.n').textContent = '펼치기'; return; }
        detail = legacyDetail(it);
        row.after(detail);
        row.querySelector('.n').textContent = '접기';
      };
      listEl.appendChild(row);
    }
  });
});

/* ───────── 백업 ───────── */
const BACKUP_KEY = /^(p12|log)_/;

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const backup = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && BACKUP_KEY.test(k)) backup[k] = localStorage.getItem(k);
  }
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'workout-log-backup-' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const backup = JSON.parse(reader.result);
      let count = 0;
      Object.keys(backup).forEach(k=>{
        if(BACKUP_KEY.test(k)){ localStorage.setItem(k, backup[k]); count++; }
      });
      alert(count + '개의 기록을 가져왔어요.');
      loadAndRender();
    }catch(err){
      alert('파일을 읽는 데 실패했어요. 올바른 백업 파일인지 확인해주세요.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '저장 중...';
  const ok = await saveNow();
  btn.textContent = ok ? '✓ 저장됨' : '저장하기';
  setTimeout(()=>{ btn.textContent = '저장하기'; btn.disabled = false; }, 1000);
});

(function init(){
  const today = todayStr();
  document.getElementById('dateInput').value = today;
  state.date = today;
  state.day = weekdayToDay(today);
  loadAndRender();
})();
</script>
